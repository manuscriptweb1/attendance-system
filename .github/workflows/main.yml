name: Sync to Old Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to old repository
        env:
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          git remote add old-repo https://x-access-token:${OLD_REPO_TOKEN}@github.com/manuscriptweb/attendance-system.git
          git push old-repo main --force
