name: Sync to Old Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test access to old repository
        uses: actions/checkout@v4
        with:
          repository: manuscriptweb/attendance-system
          token: ${{ secrets.OLD_REPO_TOKEN }}
          path: old-repo-test
          fetch-depth: 1

      - name: Push to old repository
        env:
          GH_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add old-repo https://github.com/manuscriptweb/attendance-system.git

          git push "https://x-access-token:${GH_TOKEN}@github.com/manuscriptweb/attendance-system.git" HEAD:main --force
